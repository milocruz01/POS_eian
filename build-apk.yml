name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.heycar --project-name carwash_pos --platforms=android _gen
            cp -r _gen/android ./android
            rm -rf _gen
          fi
          sed -i 's/android:label="[^"]*"/android:label="Car Wash POS"/' android/app/src/main/AndroidManifest.xml

      - name: Use the fixed signing key (so new APKs install over old ones)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk CarWashPOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarWashPOS-apk
          path: CarWashPOS.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Car Wash POS v1.0.${{ github.run_number }}
          files: CarWashPOS.apk
