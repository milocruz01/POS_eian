name: carwash_pos
description: Modern offline POS for automatic touchless car washes (HeyCar TS-5 / TS-7).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: '>=0.19.0 <1.0.0'
  excel: ^4.0.3
  file_picker: ^8.1.2
  share_plus: ^10.0.2

flutter:
  uses-material-design: true
